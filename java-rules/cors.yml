rules:
- id: permissive-cors-allowed-origin-pattern
  message: Permissive CORS configuration detected addAllowedOriginPattern("*").
  metadata:
    cwe:
    - 'CWE-183: Permissive List of Allowed Inputs'
  severity: WARNING
  languages: [java]


  pattern-either:
  - pattern: |
      CorsConfiguration $CFG = ...;
      ...
      $CFG.addAllowedOriginPattern("*");