rules:
  - id: cors-allowedOrigin
    message: Permissive CORS configuration detected ("*").
    severity: WARNING
    languages: [java]

    pattern-either:
      - pattern: $CFG.addAllowedOrigin("*")
      - pattern: $CFG.addAllowedOriginPattern("*")
      - pattern: $REG.allowedOrigins("*")
      - pattern: $REG.allowedOriginPatterns("*")
      - pattern: |
          $REG.addMapping(...)
              .allowedOrigins("*")
      - pattern: |
          $REG.addMapping(...)
              .allowedOriginPatterns("*")
      - pattern: $CFG.applyPermitDefaultValues()


  - id: cors-setAllowedOrigins-list
    message: Permissive CORS configuration detected ("*").
    severity: WARNING
    languages: [java]

    patterns:
      - pattern: $CFG.setAllowedOrigins($ARGS)
      - metavariable-pattern:
          metavariable: $ARGS
          pattern: '"*"'


  - id: cors-setAllowedOriginPatterns-list
    message: Permissive CORS configuration detected ("*").
    severity: WARNING
    languages: [java]

    patterns:
      - pattern: $CFG.setAllowedOriginPatterns($ARGS)
      - metavariable-pattern:
          metavariable: $ARGS
          pattern: '"*"'
